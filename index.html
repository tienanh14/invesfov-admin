<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị nội dung — INVESFOV.VN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  BẢN DEMO TĨNH — trang admin quản lý nội dung INVESFOV.VN.
  File riêng, dùng chung hệ design với website chính:
  font Inter (hỗ trợ tiếng Việt), theme trắng sáng, sidebar xanh navy --blue #092f78,
  nút primary #123e89, --green #008b73, --red #cf1f2b, đường kẻ --line #dde4ef.
  Dữ liệu trong trang là dữ liệu demo tĩnh, chưa nối backend, chưa có đăng nhập.
-->
<style>
:root{
  color-scheme:light;
  --bg:#f4f7fb; --surface:#fff;
  --blue:#092f78; --blue-soft:#e8effa; --btn-primary:#123e89;
  --ink:#0b285a; --body:#314460; --muted:#65738a;
  --line:#dde4ef; --red:#cf1f2b; --green:#008b73; --gold:#c89429;
  --sidebar-w:284px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--body);font-size:16px;line-height:1.6}
a{color:#0b357d;text-decoration:none}
button{font-family:inherit}

.admin-app{display:flex;min-height:100vh}

/* ===== Sidebar trái (nền navy hệ thống, KHÔNG dùng teal của ảnh mẫu) ===== */
.sidebar{width:var(--sidebar-w);background:var(--blue);color:#fff;display:flex;flex-direction:column;position:fixed;left:0;top:0;height:100vh;z-index:60}
.side-brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px}
.side-logo{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.side-logo{overflow:hidden;padding:0}
.side-logo img{width:100%;height:100%;display:block;border-radius:50%}
.side-brand-name{font-weight:800;font-size:17px;letter-spacing:.4px;line-height:1.2}
.side-brand-sub{font-size:12px;color:rgba(255,255,255,.65)}
.side-nav{flex:1;padding:6px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:rgba(255,255,255,.78);font-size:15px;font-weight:600;padding:11px 14px;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,color .15s;white-space:nowrap}
.side-item svg{width:20px;height:20px;flex-shrink:0;opacity:.85}
.side-item:hover{background:rgba(255,255,255,.08);color:#fff}
.side-item.active{background:rgba(255,255,255,.16);color:#fff}
.side-children{display:none}
.side-group.open .side-children{display:block}
.side-child{padding-left:46px;font-size:14.5px}
.side-parent .chev{width:16px;height:16px;margin-left:auto;transition:transform .15s;flex-shrink:0}
.side-group.open .side-parent .chev{transform:rotate(180deg)}
.side-item.group-on{background:rgba(255,255,255,.08);color:#fff}
@media(max-width:900px){.side-children{display:none!important}.side-parent .chev{display:none}}
.side-user{display:flex;align-items:center;gap:12px;padding:18px 20px;border-top:1px solid rgba(255,255,255,.14)}
.side-avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.side-user-name{font-size:14px;font-weight:700;line-height:1.3}
.side-user-role{font-size:12px;color:rgba(255,255,255,.6)}

/* ===== Vùng nội dung chính ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--sidebar-w)}
.main-top{background:#fff;border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;gap:24px;position:sticky;top:0;z-index:50}
.page-head{min-width:0;flex:1}
.page-head h1{font-size:22px;color:var(--ink);white-space:nowrap}
.top-search{flex:0 1 340px;max-width:340px;position:relative}
.top-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.top-search input{width:100%;height:44px;border:1px solid var(--line);border-radius:999px;padding:0 18px 0 42px;font-family:inherit;font-size:15px;color:var(--body);background:var(--bg)}
.top-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.icon-circle{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);position:relative}
.top-right{position:relative}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}
.notif-panel{position:absolute;right:0;top:calc(100% + 12px);width:392px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(9,47,120,.18);z-index:95;overflow:hidden;text-align:left}
.avatar-menu{position:absolute;right:0;top:calc(100% + 10px);width:266px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(9,47,120,.18);z-index:96;overflow:hidden;text-align:left}
.avatar-menu .am-head{padding:16px 18px;border-bottom:1px solid var(--line)}
.avatar-menu .am-item{display:flex;align-items:center;gap:11px;width:100%;padding:12px 18px;background:none;border:none;font-family:inherit;font-size:14.5px;font-weight:600;color:var(--body);cursor:pointer;text-align:left}
.avatar-menu .am-item:hover{background:#f2f6fd}
.avatar-menu .am-item svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.avatar-menu .am-item.danger{color:var(--red)}
.avatar-menu .am-item.danger svg{color:var(--red)}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.notif-head .cell-title{font-size:16px}
.notif-readall{background:none;border:none;color:var(--blue);font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;padding:0}
.notif-list{max-height:430px;overflow-y:auto}
.notif-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid #eef2f8;cursor:pointer;align-items:flex-start}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:var(--bg)}
.notif-item.unread{background:#f4f8ff}
.notif-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-ico svg{width:17px;height:17px}
.notif-text{font-size:14px;color:var(--ink);line-height:1.45;font-weight:600}
.notif-item.unread .notif-text{font-weight:700}
.notif-time{font-size:12.5px;color:var(--muted);margin-top:2px}
.notif-empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
.icon-circle svg{width:19px;height:19px}
.top-avatar{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}

.main-body{padding:28px 32px 64px;max-width:1240px;width:100%;margin:0 auto}

/* ===== Hàng công cụ ===== */
.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.toolbar .grow{flex:1;min-width:220px;position:relative}
.toolbar .grow svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.toolbar input[type=text]{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 16px 0 42px;font-family:inherit;font-size:15px;color:var(--body);background:#fff}
.btn{font-family:inherit;font-size:15px;font-weight:700;border-radius:10px;padding:0 22px;height:46px;cursor:pointer;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--btn-primary);color:#fff}
.btn-primary:hover{background:#0d3470}
.btn-outline{background:#fff;border-color:var(--line);color:var(--body)}
.btn-secondary{background:#e9eef8;border-color:#d4def2;color:var(--ink)}
.btn-secondary:hover{background:#dbe4f6}
.field label.thumb-pick{display:inline-flex;width:auto}
.btn-outline:hover{border-color:#0b357d;color:#0b357d}
.btn-danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn-sm{height:36px;padding:0 14px;font-size:14px;font-weight:600}
.filter-panel{display:none;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.filter-panel.open{display:flex}
.filter-panel select{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-family:inherit;font-size:15px;color:var(--body);background:#fff;min-width:190px}
.filter-panel .fdate{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);white-space:nowrap}
.filter-panel input[type=date]{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-family:inherit;font-size:15px;color:var(--body);background:#fff}

/* ===== 4 thẻ thống kê ===== */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.stat-label{font-size:17px;color:var(--ink);font-weight:700}
.stat-row{display:flex;align-items:baseline;gap:10px;margin-top:10px;flex-wrap:wrap}
.stat-num{font-size:32px;font-weight:800;color:var(--ink);line-height:1.1}
.stat-note{font-size:13.5px;color:var(--muted)}

/* ===== Bảng dữ liệu ===== */
.table-card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;overflow-x:auto}
.table-card.bare{background:transparent;border:none;border-radius:0;overflow:visible}
.merged-block{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;overflow-x:auto}
.merged-block + .merged-block{margin-top:22px}
.tbl-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px 12px}
.tbl-head .cell-title{font-size:16.5px}
.tbl-head-sep{border-top:1px solid var(--line)}
.mini-select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-family:inherit;font-size:14px;color:var(--body);background:#fff;cursor:pointer}
.empty-state{background:#fff;border:1px solid var(--line);border-radius:14px;padding:56px 24px;text-align:center;color:var(--muted);font-size:15.5px}
table{width:100%;border-collapse:collapse;min-width:720px}
thead th{color:var(--body);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;text-align:left;padding:13px 18px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
tbody td{padding:10px 18px;border-bottom:1px solid #eef2f8;vertical-align:middle;font-size:15px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafcff}
.cell-title{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:400px}
.title-1line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);color:var(--body);border-radius:999px;padding:2px 9px;font-size:12.5px;margin:1px 3px 1px 0;white-space:nowrap}
.star{color:var(--gold);font-size:19px;line-height:1}
.cell-sub{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 12px;white-space:nowrap}
.chip-green{background:#e7f4ef;color:#086955}
.chip-gray{background:#f0f3f8;color:var(--muted)}
.chip-blue{background:#e8effa;color:#0b357d}
.chip-red{background:#fdecec;color:var(--red)}
.row-actions{display:flex;gap:6px;white-space:nowrap;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:#0b357d;color:#0b357d}
.icon-btn.danger:hover{border-color:var(--red);color:var(--red)}
.icon-btn.wide{width:auto;padding:0 12px;gap:7px;font-family:inherit}
.icon-btn .cnt{font-size:13.5px;font-weight:800;color:#0b357d}
tbody tr.row-click{cursor:pointer}
tbody tr.row-click:hover{background:#f2f7ff}
.back-bar{display:none;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.back-bar .back-title{font-size:16px}
.back-bar .back-title strong{color:var(--ink)}

/* ===== Phân trang ===== */
.pagination{display:flex;align-items:center;justify-content:space-between;gap:12px 22px;flex-wrap:wrap;margin-top:0;padding:14px 18px;border-top:1px solid var(--line)}
.pagination-info{margin:0;color:var(--muted);font-size:14px}
.page-btns{display:flex;gap:8px;align-items:center}
.page-btn{min-width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:8px;font-family:inherit;font-size:15px;color:var(--body);cursor:pointer;padding:0 10px}
.page-btn.cur{background:#0b357d;border-color:#0b357d;color:#fff;font-weight:700}
.page-btn.dim{opacity:.4;cursor:default}
.page-btn svg{width:18px;height:18px;display:block}
.page-range{font-size:14px;color:var(--muted)}

/* ===== Modal form ===== */
.modal-back{position:fixed;inset:0;background:rgba(11,40,90,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:720px;width:100%;max-height:92vh;overflow:auto}
.modal.modal-wide{max-width:920px}
.req{color:#e5484d}
.thumb-wrap{display:flex;gap:14px;align-items:flex-start}
.thumb-preview{width:190px;height:108px;border:1px dashed #c6d3e8;border-radius:10px;background:#fbfcfe;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden;flex:none;text-align:center;padding:8px}
.thumb-preview img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-name{font-size:13px;color:var(--muted);margin-top:7px}
.rte{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.rte-bar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:#f4f6fb;border-bottom:1px solid var(--line);padding:6px 8px}
.rte-btn{position:relative;min-width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:#314460;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-family:inherit}
.rte-btn:hover{background:#e2eaf8}
.rte-btn svg{width:15px;height:15px;flex:none}
.rte-color{font-weight:800;box-shadow:inset 0 -3px 0 #e5484d;border-radius:4px}
.rte-color input,.rte-hilite input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.rte-sep{width:1px;height:20px;background:#c9d6ee;margin:0 5px;flex:none}
.rte-body{min-height:300px;padding:16px 18px;font-size:15.5px;line-height:1.75;color:var(--body);outline:none}
.rte-body:empty:before{content:attr(data-ph);color:#93a5c4}
.rte-body h2{font-size:22px;color:var(--ink);margin:12px 0 8px}
.rte-body h3{font-size:18px;color:var(--ink);margin:12px 0 8px}
.rte-body blockquote{border-left:3px solid var(--blue);padding-left:14px;color:var(--muted);margin:10px 0}
.rte-body pre{background:#f4f6fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px;overflow:auto}
.time-range{display:flex;gap:12px}
.time-cell{flex:1;min-width:0}
.time-cell span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.tl-editor{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.tl-row{display:flex;gap:8px;align-items:center}
.tl-row .tl-time{width:104px;flex:none;text-align:center}
.tl-row .tl-text{flex:1;min-width:0}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
.stat-strip{grid-column:1/-1;background:#fff;border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr)}
.ss-item{padding:20px 26px}
.ss-item + .ss-item{border-left:1px solid var(--line)}
.ss-num{font-size:31px;font-weight:800;color:var(--ink);line-height:1.1}
.ss-label{font-size:13.5px;color:var(--muted);margin-top:4px}
@media(max-width:760px){ .stat-strip{grid-template-columns:repeat(2,1fr)} .ss-item:nth-child(3){border-left:none} .ss-item:nth-child(n+3){border-top:1px solid var(--line)} }
@media(max-width:1050px){.home-grid{grid-template-columns:1fr}}
.panel-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 22px 14px;margin-top:22px}
.home-grid .panel-card{margin-top:0}
.panel-card .tbl-head{padding-left:0;padding-right:0}
.queue-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #eef2f9;cursor:pointer}
.queue-row:last-child{border-bottom:0}
.queue-row:hover{background:#f7faff}
.queue-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none}
.queue-ico svg{width:18px;height:18px}
.queue-row .q-label{flex:1;font-weight:600;color:var(--ink);font-size:15px}
.queue-row .q-sub{font-size:13px;color:var(--muted)}
.q-badge{background:#fdf1de;color:#96650a;font-weight:800;border-radius:999px;padding:3px 11px;font-size:13.5px;white-space:nowrap}
.act-row{display:flex;gap:12px;padding:11px 2px;border-bottom:1px solid #eef2f9}
.act-row:last-child{border-bottom:0}
.act-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:7px;flex:none}
.act-row .a-text{flex:1;font-size:14.5px;color:var(--body);line-height:1.55}
.act-row .a-text strong{color:var(--ink)}
.act-row .a-time{font-size:12.5px;color:var(--muted);white-space:nowrap}
.ev-row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #eef2f9;cursor:pointer}
.ev-row:last-child{border-bottom:0}
.ev-row:hover{background:#f7faff}
.ev-row .e-main{flex:1;min-width:0}
.reg-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #eef2f9}
.reg-row:last-child{border-bottom:0}
.reg-row .r-main{flex:1;min-width:0}
.preview-back{position:fixed;inset:0;background:rgba(9,32,77,.55);display:none;align-items:flex-start;justify-content:center;z-index:120;padding:26px 16px;overflow-y:auto}
.preview-back.open{display:flex}
.preview-panel{background:#fff;border-radius:16px;max-width:880px;width:100%;box-shadow:0 24px 70px rgba(9,47,120,.35);overflow:hidden}
.preview-bar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-bottom:1px solid var(--line);background:#fbfcfe;font-weight:700;color:var(--ink);font-size:14.5px}
.preview-article{padding:30px 44px 38px}
.pv-cat{color:var(--blue);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.pv-title{font-size:33px;line-height:1.28;font-weight:800;color:var(--ink);margin-bottom:14px}
.pv-meta{color:var(--muted);font-size:14px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.pv-img{width:100%;border-radius:12px;display:block;margin-bottom:24px}
.pv-lead{font-size:17px;line-height:1.75;font-weight:700;color:var(--ink);margin-bottom:16px}
.pv-p{font-size:16.5px;line-height:1.8;color:var(--body);margin-bottom:16px}
.pv-note{border:1px dashed var(--line);background:#fbfcfe;border-radius:12px;padding:16px 18px;color:var(--muted);font-size:14.5px;line-height:1.65}
.pv-status{font-size:13.5px;color:var(--muted);font-style:italic;margin-top:22px;line-height:1.65}
.pv-origin{display:inline-block;margin-top:10px;color:var(--blue);font-weight:700}
@media(max-width:640px){.preview-article{padding:22px 20px 28px}.pv-title{font-size:25px}}
.modal-head{padding:20px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:6;border-radius:14px 14px 0 0}
.modal-head h2{font-size:20px;color:var(--ink)}
.modal-close{background:none;border:none;font-size:26px;cursor:pointer;color:var(--muted)}
.modal-body{padding:24px 28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-family:inherit;font-size:15px;color:var(--body);background:#fff}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
.check input{width:18px;height:18px}
.modal-foot{padding:18px 28px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.modal-foot .btn{margin:0;height:44px}
.note-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 20px;font-size:14px;color:var(--muted);margin-top:28px}

/* ===== Tab con trong mỗi mục chính ===== */
.subtabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.subtab{font-family:inherit;font-size:15px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer}
.subtab:hover{color:#0b357d;border-color:#0b357d}
.subtab.active{background:var(--blue);border-color:var(--blue);color:#fff}
/* ===== Nhóm Hệ thống ở cuối sidebar ===== */
.side-divider{height:1px;background:rgba(255,255,255,.14);margin:10px 14px;flex-shrink:0}
.side-label{font-size:11.5px;font-weight:800;letter-spacing:1.2px;color:rgba(255,255,255,.5);padding:4px 20px 8px;flex-shrink:0}
/* ===== Chip vàng + nhãn thẩm định + form card ===== */
.chip-gold{background:#faf3e2;color:#9a6f14}
.appr{font-size:12.5px;font-weight:800;white-space:nowrap}
.appr-green{color:var(--green)} .appr-orange{color:var(--gold)} .appr-red{color:var(--red)}
.perm-check{width:18px;height:18px;accent-color:#0b357d;cursor:pointer}
.form-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:22px}

/* ===== Responsive ===== */
@media(max-width:1100px){ .stats{grid-template-columns:repeat(2,1fr)} }
@media(max-width:900px){
  :root{--sidebar-w:76px}
  .side-brand{justify-content:center;padding:20px 0 16px}
  .side-brand-text,.side-item span,.side-user-text,.side-label,.side-divider{display:none}
  .side-item{justify-content:center;padding:12px 0}
  .side-nav{padding:6px 10px;align-items:center}
  .side-user{justify-content:center;padding:16px 0}
  .main-top{padding:14px 18px;gap:14px}
  .main-body{padding:20px 18px 48px}
  .top-search{display:none}
}
@media(max-width:620px){
  .admin-app{flex-direction:column}
  .main{margin-left:0;margin-top:64px}
  .main-top{position:static}
  .sidebar{width:100%;height:auto;position:fixed;top:0;left:0;right:0;flex-direction:row;align-items:center;padding:10px 12px;gap:8px}
  .side-brand{padding:0}
  .side-nav{flex:1;flex-direction:row;overflow-x:auto;padding:0;gap:6px}
  .side-item{padding:9px 12px}
  .side-item span{display:inline;font-size:14px}
  .side-item svg{width:18px;height:18px}
  .side-user{display:none}
  .side-label,.side-divider{display:none}
  .page-head h1{font-size:19px}
  .stats{grid-template-columns:1fr 1fr;gap:12px}
  .stat-num{font-size:26px}
}
</style>
</head>

    {t:"Hội chợ Thương mại và triển lãm quốc tế: nơi hàng Việt gặp gỡ nhà mua hàng quốc tế", c:"Tổng kết", d:"19/10/2026", s:"Ban biên tập INVESFOV", st:"published", tags:["triển lãm","giao thương"], auth:"Ban biên tập", big:true, img:"events", lead:"Hội chợ Thương mại và triển lãm quốc tế đã khép lại sau một ngày hoạt động sôi nổi, để lại nhiều ấn tượng tốt đẹp trong lòng doanh nghiệp tham gia và khách tham quan. Ngay từ lễ khai mạc, khu triển lãm đã trở thành điểm hẹn của các doanh nghiệp sản xuất, xuất khẩu trong nước với nhà mua hàng và nhà phân phối đến từ nhiều thị trường.", copy:["Tại các khu gian hàng, doanh nghiệp Việt Nam giới thiệu đa dạng nhóm sản phẩm, từ nông sản chế biến như cà phê, hạt điều, thủy sản đông lạnh đến hàng công nghiệp như đồ gỗ nội thất và dệt may. Mỗi gian hàng đều dành thời gian tư vấn trực tiếp, giúp khách tham quan hiểu rõ hơn về quy cách sản phẩm, năng lực sản xuất và câu chuyện thương hiệu phía sau từng mặt hàng.","Điểm nhấn của chương trình là các phiên gặp gỡ nhà mua hàng (B2B matching) được sắp xếp theo lịch hẹn trước. Tại đây, nhà cung cấp Việt Nam và nhà mua hàng quốc tế có dịp trao đổi trực tiếp về nhu cầu, điều kiện hợp tác và khả năng cung ứng, thay vì chỉ dừng lại ở việc tham quan và tìm hiểu thông tin chung.","Song song với hoạt động giao thương, khu vực trình diễn sản phẩm tiêu biểu thu hút sự quan tâm của đông đảo khách tham quan. Những sản phẩm nổi bật cùng câu chuyện về vùng nguyên liệu, quy trình sản xuất và định hướng xuất khẩu được giới thiệu sinh động, góp phần làm nổi bật hình ảnh hàng hóa Việt Nam.","Khép lại chương trình, ban tổ chức tổng kết kết quả giao thương trong ngày và trao chứng nhận tham gia cho các đơn vị trưng bày. Những kết nối được hình thành tại hội chợ sẽ tiếp tục được hỗ trợ theo dõi và trao đổi sau sự kiện, để cơ hội giao thương ban đầu có thể tiến tới hợp tác cụ thể trong thời gian tới."], note:"Bài viết mẫu đăng kèm sự kiện đã diễn ra trên website (nội dung minh họa) — cần thay bằng bài tường     {t:"140+ nhà đầu tư quốc tế tìm cơ hội tại Việt Nam sau cú nâng hạng của FTSE Russell", c:"Đầu tư – thương mại", d:"14/10/2026", s:"VnBusiness", st:"published", tags:["đầu tư","FDI"], auth:"Ban biên tập", img:"port", lead:"Hội nghị Nhà đầu tư 2026 (VinaCapital, 13/10, TP.HCM) đặt Việt Nam vào chiến lược phân bổ vốn mới của châu Á.", copy:["Hội nghị Nhà đầu tư 2026 của VinaCapital khai mạc 13/10 tại TP.HCM với hơn 140 nhà đầu tư quốc tế; chủ đề \"Việt Nam: Vị thế mới trong chiến lược phân bổ vốn tại châu Á\" sau khi FTSE Russell nâng hạng chứng khoán Việt Nam lên Thị trường Mới nổi Thứ cấp (21/9/2026); Chủ tịch UBND TP.HCM Nguyễn Văn Được nêu ưu tiên thu hút vốn chất lượng cao vào công nghệ, AI, năng lượng xanh, logistics."], url:"https://vnbusiness.vn/tphcm-hon-140-nha-dau-tu-nuoc-ngoai-tim-kiem-co-hoi-dau-tu-tai-viet-nam.html", note:"Bài viết đã xuất bản trên VnBusiness ngày 14/10/2026. Nội dung hiển thị tại đây là bản tóm tắt diễn đạt lại; vui lòng đọc bài gốc để nắm đầy đủ thông tin."},
    {t:"Niềm tin doanh nghiệp châu Âu giữ ở mức cao: BCI đạt 78,3 điểm quý III/2026", c:"Đầu tư – thương mại", d:"15/10/2026", s:"EuroCham / Tin nhanh chứng khoán", st:"published", tags:["BCI","doanh nghiệp châu Âu"], auth:"Ban biên tập", img:"city", lead:"BCI quý III/2026 đạt 78,3 điểm (giảm 1,4 so với 79,7 quý trước, vẫn ở mức cao); 90% doanh nghiệp sẵn sàng giới thiệu Việt Nam là điểm đến đầu tư; FDI đăng ký 9 tháng đầu 2026 đạt 50,36 tỷ USD, vốn thực hiện 21,07 tỷ USD — cao nhất 5 năm; điểm nghẽn: thủ tục hành chính, quy định chưa nhất quán, thuế.", copy:["Khảo sát Chỉ số Niềm tin Kinh doanh (BCI) quý III/2026 của EuroCham, công bố ngày 15/10/2026, ghi nhận chỉ số đạt 78,3 điểm — giảm 1,4 điểm so với mức 79,7 của quý trước nhưng vẫn ở mức cao. Có 64% doanh nghiệp đánh giá tình hình kinh doanh hiện tại tốt hoặc rất tốt, 28% đánh giá trung lập; đáng chú ý, 90% doanh nghiệp sẵn sàng giới thiệu Việt Nam là điểm đến đầu tư.","Về cam kết dài hạn, 63% doanh nghiệp dự kiến ở lại Việt Nam trên 5 năm và 23% có tầm nhìn trên 20 năm. Theo lĩnh vực, Nông nghiệp & chuỗi giá trị thực phẩm tăng 11,7 điểm lên 83,9, trong khi Du lịch – Khách sạn giảm 22,5 điểm xuống 67,9.","Các rào cản lớn nhất mà doanh nghiệp nêu ra gồm thủ tục hành chính và giấy tờ (60%), quy định thiếu rõ ràng hoặc không nhất quán (53%), quản lý thuế (52%) và thiếu nhân tài (49%). Trong bối cảnh đó, vốn FDI đăng ký trong 9 tháng đầu năm 2026 đạt 50,36 tỷ USD, vốn thực hiện đạt 21,07 tỷ USD — mức cao nhất trong 5 năm."], url:"https://www.tinnhanhchungkhoan.vn/post-399490.html", note:"Bài viết đã xuất bản trên Tin nhanh chứng khoán ngày 15/10/2026, dẫn kết quả khảo sát BCI của EuroCham. Nội dung hiển thị tại đây là bản tóm tắt diễn đạt lại; vui lòng đọc bài gốc để nắm đầy đủ thông tin."},
    {t:"Quốc tịch, hộ tịch và thủ tục lãnh sự", c:"Chính sách", d:"Chưa xuất bản", s:"Mẫu", st:"draft", tags:["lãnh sự","hộ tịch"], auth:"Ban biên tập", img:"policy", lead:"Nhóm quy định và hướng dẫn theo tình huống về quốc tịch, hộ tịch, giấy tờ và thủ tục lãnh sự dành cho công dân ở nước ngoài.", copy:["Nhóm nội dung này tập hợp các quy định và hướng dẫn theo tình huống về quốc tịch, hộ tịch, giấy tờ và thủ tục lãnh sự dành cho công dân ở nước ngoài.","Số hiệu, ngày ban hành, hiệu lực và cơ quan ban hành của từng văn bản sẽ được bổ sung khi nguồn tham chiếu được xác nhận."], note:"Nội dung đang cập nhật nguồn; các trường số hiệu, ngày ban hành, hiệu lực và cơ quan ban hành chưa cập nhật."},
    {t:"Đầu tư, doanh nghiệp, thuế, đất đai và thương mại", c:"Chính sách", d:"Chưa xuất bản", s:"Mẫu", st:"draft", tags:["pháp luật","thuế"], auth:"Ban biên tập", img:"policy", lead:"Nhóm văn bản phục vụ tra cứu khi tìm hiểu cơ hội đầu tư, thành lập doanh nghiệp, nghĩa vụ thuế, đất đai và hoạt động thương mại tại Việt Nam.", copy:["Nhóm nội dung này phục vụ tra cứu khi tìm hiểu cơ hội đầu tư, thành lập doanh nghiệp, nghĩa vụ thuế, đất đai và hoạt động thương mại tại Việt Nam.","Số hiệu, ngày ban hành, hiệu lực và cơ quan ban hành của từng văn bản sẽ được bổ sung khi nguồn tham chiếu được xác nhận."], note:"Nội dung đang cập nhật nguồn; các trường số hiệu, ngày ban hành, hiệu lực và cơ quan ban hành chưa cập nhật."},

    {t:"Bài tin mẫu — Tin tức và truyền thông 02", c:"Tin chính thống", d:"Chưa xuất bản", s:"Mẫu", st:"draft", tags:["tin mẫu"], auth:"Biên tập viên mẫu"},
    {t:"Bản tin dành cho cộng đồng người Việt Nam ở nước ngoài", c:"Tin chính thống", d:"Chưa xuất bản", s:"Chờ kết nối nguồn chính thống", st:"draft", big:true, tags:["cộng đồng","kiều bào"], auth:"Ban biên tập", img:"news", lead:"Khu vực tổng hợp thông tin trong nước, quốc tế và cộng đồng kiều bào; bài viết chỉ xuất bản sau khi xác định rõ nguồn tham chiếu.", copy:["Nội dung được định hướng thành bản tin tổng hợp, giúp người đọc theo dõi các thông tin có liên quan trực tiếp tới cộng đồng người Việt Nam ở nước ngoài trong cùng một không gian.","Mỗi bài tin sẽ hiển thị rõ ngày đăng, cơ quan hoặc đơn vị phát hành và đường dẫn tham chiếu. Nội dung chi tiết đang chờ kết nối với nguồn tin chính thống trước khi xuất bản."], note:"Bài viết đang chờ nguồn tham chiếu và ngày xuất bản trước khi công bố chính thức."},

function fmtD(iso){ if(!iso) return "—"; const p = iso.split("-"); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : iso; }
function capMatch(r, fcap){
  if(!fcap) return true;
  const n = (r.capN===undefined ? null : r.capN);
  if(fcap==="none") return n===null;
  if(n===null) return false;
  if(fcap==="lt500") return n<500;
  if(fcap==="500to1000") return n>=500 && n<=1000;
  if(fcap==="1000to2000") return n>1000 && n<=2000;
  if(fcap==="gt2000") return n>2000;
  return true;
}

function searchText(k, r){
  switch(k){
    case "home": return r.t+" "+r.sum;
    case "news_articles": case "events_event_news": return r.t+" "+r.c+" "+r.s+" "+(r.tags||[]).join(" ")+" "+(r.auth||"");
    case "events_events": return r.t+" "+r.ty+" "+r.loc;
    case "projects_projects": return r.t+" "+(r.own||"")+" "+r.loc+" "+r.ind;
    case "projects_review": return r.t+" "+(r.own||"")+" "+r.loc+" "+r.ind;
    case "projects_interests": return r.code+" "+r.proj+" "+r.inv+" "+r.det;
    case "projects_demands": return r.name+" "+r.email+" "+r.phone+" "+r.itype+" "+r.country+" "+r.market+" "+r.industry+" "+r.needs;
    case "products_products": return r.t+" "+r.sup+" "+r.g;
    case "products_review": return r.t+" "+r.sup+" "+r.g;
    case "products_trade_demands": return r.code+" "+r.title+" "+r.dtype+" "+r.market;
    case "products_trade_connections": return r.code+" "+r.target+" "+r.req+" "+r.reason;
    case "community_users": return r.name+" "+r.email;
    case "community_verification": return r.user+" "+r.vtype+" "+r.docs;
    case "system_notifications": return r.title+" "+r.to;
    case "system_audit": return r.actor+" "+r.action+" "+r.entity;
    default: return "";
  }
}

function actions(k, di){
  const eye = k==="projects_demands"
    ? `<button class="icon-btn" title="Xem chi tiết nhu cầu" onclick="viewDemand(${di})">${ICO.eye}</button>`
    : k==="news_articles"
    ? `<button class="icon-btn" title="Xem trước bài viết" onclick="previewNews(${di})">${ICO.eye}</button>`
    : k==="events_event_news"
    ? `<button class="icon-btn" title="Xem trước bài viết" onclick="previewNews(${di},'events_event_news')">${ICO.eye}</button>`
    : k==="projects_projects"
    ? `<button class="icon-btn" title="Xem chi tiết dự án" onclick="viewProject(${di})">${ICO.eye}</button>`
    : `<button class="icon-btn" title="Xem trước" onclick="alert('Xem trước (demo: hiển thị như trên website).')">${ICO.eye}</button>`;
  const pen = `<button class="icon-btn" title="Sửa" onclick="openEdit()">${ICO.pen}</button>`;
  const del = `<button class="icon-btn danger" title="Xóa" onclick="delItem('${k}',${di})">${ICO.trash}</button>`;
  if(k==="system_audit") return "";
  const b = [eye, pen];
  if(["projects_interests","projects_demands","products_trade_connections"].includes(k))
    b.push(`<button class="icon-btn" title="Chuyển trạng thái: Chờ xử lý → Đang xử lý → Hoàn thành (demo)" onclick="advance('${k}',${di})">${ICO.refresh}</button>`);
  if(k==="events_registrations"){
    const rr = DATA.events_registrations[di];
    if(rr && rr.st==="registered")
      b.push(`<button class="btn btn-primary btn-sm" title="Chấp nhận đăng ký tham dự" onclick="regAct(${di},'confirmed')">Chấp nhận</button>`,
             `<button class="btn btn-outline btn-sm" title="Từ chối đăng ký tham dự" onclick="regAct(${di},'rejected')">Từ chối</button>`);
  }
  if(k==="products_trade_demands")
    b.push(`<button class="icon-btn" title="Duyệt (demo)" onclick="approveTD(${di})">${ICO.check}</button>`,
           `<button class="icon-btn danger" title="Từ chối kèm lý do (demo)" onclick="rejectTD(${di})">${ICO.x}</button>`);
  if(k==="community_verification")
    b.push(`<button class="icon-btn" title="Duyệt (demo)" onclick="verifyDo(${di},'approved')">${ICO.check}</button>`,
           `<button class="icon-btn" title="Yêu cầu bổ sung (demo)" onclick="verifyDo(${di},'supplement')">${ICO.doc}</button>`,
           `<button class="icon-btn danger" title="Từ chối (demo)" onclick="verifyDo(${di},'rejected')">${ICO.x}</button>`);
  if(k==="community_users")
    b.push(`<button class="icon-btn" title="Khóa / mở tài khoản (demo)" onclick="toggleLock(${di})">${ICO.lock}</button>`);
  b.push(del);
  return `<div class="row-actions">${b.join("")}</div>`;
}

function renderAuditLog(){
  const q = document.getElementById("q").value.toLowerCase();
  const match = r => (r.actor + " " + r.action + " " + r.entity).toLowerCase().includes(q);
  const tabs = [["all","Tất cả"]].concat(AUDIT_SECS).map(([k,label])=>{
    const cnt = DATA.system_audit.filter(r => (k==="all" || r.sec===k) && match(r)).length;
    return `<button class="subtab${auditSec===k ? " active" : ""}" onclick="setAuditSec('${k}')">${label} (${cnt})</button>`;
  }).join("");
  const rows = DATA.system_audit.filter(r => (auditSec==="all" || r.sec===auditSec) && match(r));
  const withSec = auditSec==="all";
  const heads = withSec ? ["Người thực hiện","Hành động","Đối tượng","Phần","Thời gian","IP"] : HEADERS.system_audit;
  const secLabel = s => (AUDIT_SECS.find(x=>x[0]===s)||[])[1] || "";
  const body = rows.length ? rows.map(r=>{

  document.getElementById("pagination").style.display = "flex";

function renderTable(){
  if(cur==="home"){ document.getElementById("pagination").style.display = "none"; return; }
  if(cur==="events" && sub==="events" && evDetail!==null) return renderEventRegsTable();
  const k = key();
  if(cur==="system") return renderSystemMerged();
  if(k==="system_master") return renderMaster();
  if(k==="community_permissions") return renderPermissions();
  if(k==="system_notifications") return renderNotifications();
  if(k==="products_products") return renderProductsMerged();
  if(k==="projects_projects") return renderProjectsMerged();
  if(k==="products_connections") return renderTradeConnections();
  if(k==="community_personal" || k==="community_business") return renderCommunityMerged();
  document.getElementById("tableCard").innerHTML = TABLE_HTML;
  renderHead();
  const q = document.getElementById("q").value.toLowerCase();
  const fs = document.getElementById("fStatus").value;
  const fc = document.getElementById("fCat").value;
  let rows = DATA[k].filter(r =>
    searchText(k,r).toLowerCase().includes(q) && (!fs || r.st===fs) && (!fc || catOf(k,r)===fc));
  if(k==="projects_projects"){
    const fp = document.getElementById("fProv").value;
    const fcap = document.getElementById("fCap").value;
    const ffrom = document.getElementById("fFrom").value;
    const fto = document.getElementById("fTo").value;
    rows = rows.filter(r =>
      (!fp || r.loc===fp) && capMatch(r, fcap) &&
      (!ffrom || (r.date && r.date>=ffrom)) && (!fto || (r.date && r.date<=fto)));
  }
  const ncol = HEADERS[k].length;
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(pageCur > pages) pageCur = pages;
  if(pageCur < 1) pageCur = 1;
  const start = total ? (pageCur-1)*PAGE_SIZE : 0;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  document.getElementById("tbody").innerHTML = pageRows.map(r=>rowHTML(k, r, DATA[k].indexOf(r))).join("") ||
    `<tr><td colspan="${ncol}" class="cell-sub" style="text-align:center;padding:32px">Không có mục nào.</td></tr>`;
  document.getElementById("pageInfo").textContent = total ? `Hiển thị ${start+1}–${start+pageRows.length} trong tổng số ${total}` : "Hiển thị 0 trong tổng số 0";
  document.getElementById("pageBtns").innerHTML = pageBtnsHTML(start, pageRows.length, total, pages);
  document.getElementById("pagination").style.display = "flex";
}

function tradeTargets(){
  const P = DATA.products_products.map((r,i)=>({kind:"PRODUCT", idx:i, name:r.t, owner:r.sup, extra:r.g, st:r.st}));
  const D = DATA.products_trade_demands.map((r,i)=>({kind:"DEMAND", idx:i, name:r.title, owner:r.code, extra:r.dtype + " · " + r.market, st:r.st}));
  return P.concat(D);
}
function reqsOfTarget(kind, name){
  return DATA.products_trade_connections.filter(x=>x.ttype===kind && x.target===name);
}
function renderTradeConnections(){
  const q = document.getElementById("q").value.toLowerCase();
  const rows = tradeTargets().filter(t => t.name.toLowerCase().includes(q));

    `<div class="merged-block"><div class="tbl-head"><span class="cell-title">Danh sách mục tiêu kết nối</span><span class="cell-sub">Bấm vào một mục tiêu để xem thông tin và các member đã gửi yêu cầu tới mục tiêu đó</span></div>` +

    (rows.map(t=>{ const cnt = reqsOfTarget(t.kind, t.name).length; return `<tr class="row-click" title="Bấm để xem chi tiết mục tiêu" onclick="if(!event.target.closest('button'))viewTradeTarget('${t.kind}',${t.idx})"><td><div class="cell-title">${t.name}</div><div class="cell-sub">${t.extra}</div></td><td>${t.kind==="PRODUCT" ? "Sản phẩm" : "Nhu cầu thương mại"}</td><td>${t.owner}</td><td>${chip(t.st)}</td><td>${cnt ? cnt + " yêu cầu" : "—"}</td><td><div class="row-actions"><button class="icon-btn" title="Xem chi tiết mục tiêu" onclick="viewTradeTarget('${t.kind}',${t.idx})">${ICO.eye}</button></div></td></tr>`; }).join("") || `<tr><td colspan="6" class="cell-sub" style="text-align:center;padding:32px">Không có mục nào.</td></tr>`) +

function viewTradeTarget(kind, idx){
  const item = (l,v)=>`<div style="grid-column:1/-1;display:grid;grid-template-columns:minmax(150px,200px) 1fr;gap:6px 16px;padding:11px 0"><div style="font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-top:3px">${l}</div><div style="font-size:15px;line-height:1.65;color:var(--body)">${v||"—"}</div></div>`;
  let name = "", meta = "", info = "";
  if(kind==="PRODUCT"){
    const r = DATA.products_products[idx]; if(!r) return;
    name = r.t;
    meta = `<span style="color:var(--muted);font-size:13.5px">Sản phẩm · ${r.g}</span>${chip(r.st)}`;
    info = item("Tên sản phẩm", r.t) + item("Nhà cung cấp", r.sup) + item("Nhóm hàng", r.g) +
           item("Trạng thái hiển thị", STATUS[r.st] ? STATUS[r.st].t : r.st);
  } else {
    const r = DATA.products_trade_demands[idx]; if(!r) return;
    name = r.title;
    meta = `<span style="color:var(--muted);font-size:13.5px">Nhu cầu thương mại · ${r.code}</span>${chip(r.st)}`;
    info = item("Mã nhu cầu", r.code) + item("Tiêu đề nhu cầu", r.title) + item("Loại nhu cầu", r.dtype) +
           item("Ngành", r.ind) + item("Thị trường mục tiêu", r.market) + item("Số lượng", r.qty) +
           (r.reason ? item("Lý do từ chối", r.reason) : "");
  }
  const reqs = reqsOfTarget(kind, name);
  const mem = reqs.length ? reqs.map(x=>`
    <div style="background:#f7f9fc;border-radius:10px;padding:13px 16px;margin-top:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><span style="font-weight:700;color:var(--ink);font-size:15px">${x.req}</span>${chip(x.st)}</div>
      <div style="color:var(--muted);font-size:13.5px;margin-top:5px">${x.code}${x.handler && x.handler!=="—" ? " · Người phụ trách: " + x.handler : ""}</div>
      <div style="font-size:14.5px;line-height:1.65;color:var(--body);margin-top:6px">${x.reason||""}</div>
      ${x.notes ? `<div style="font-size:13.5px;color:var(--muted);margin-top:4px">Ghi chú xử lý: ${x.notes}</div>` : ""}
    </div>`).join("")
    : `<div style="color:var(--muted);font-size:14.5px;margin-top:8px">Chưa có member nào gửi yêu cầu tới mục tiêu này.</div>`;
  document.getElementById("modalTitle").textContent = "Chi tiết mục tiêu kết nối";
  document.getElementById("btnCancel").textContent = "Đóng";
  const head = `<div style="grid-column:1/-1;margin-bottom:2px"><div style="font-size:19px;font-weight:800;color:var(--ink);line-height:1.35">${name}</div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px">${meta}</div></div>`;
  document.getElementById("modalBody").innerHTML = head + info +
    `<div style="grid-column:1/-1;margin-top:18px"><div style="font-size:16px;font-weight:800;color:var(--ink)">Member đã gửi yêu cầu (${reqs.length})</div>${mem}</div>`;
  const save = document.getElementById("btnSave");
  save.style.display = "none"; modalAction = null;
  document.getElementById("modal").classList.add("open");
}

    document.getElementById("filterPanel").classList.remove("open");

  }
  const scHTML = statCards();

  const tb = document.getElementById("toolbar");

    tb.style.display = "none";

  } else {
    tb.style.display = "flex";

    document.getElementById("addLabel").textContent = meta.add || "+ Thêm mới";
    document.getElementById("q").placeholder = meta.q;

    const fc = document.getElementById("fCat");
    fc.style.display = cats.length ? "" : "none";
    fc.innerHTML = `<option value="">${FCAT_LABEL[k]||"Tất cả chuyên mục"}</option>` +
      cats.map(c=>`<option value="${c}">${TYPE_LABEL[c]||c}</option>`).join("");

      so.map(s=>`<option value="${s}">${STATUS[s].t}</option>`).join("");
    document.getElementById("filterPanel").classList.remove("open");
  }
  renderTable();
}

  const card=(icon,color,label,num,note)=>`<div class="stat"><div class="stat-label">${label}</div><div class="stat-row"><div class="stat-num">${num}</div><div class="stat-note">${note}</div></div></div>`;
  return [
    card(ICO.users,"blue","Tổng đăng ký",R.length,"của sự kiện đang xem"),
    card(ICO.users,"green","Đã xác nhận",n(R,"confirmed"),"registration_status"),
    card(ICO.users,"gold","Đã điểm danh",R.filter(r=>r.ci).length,"check-in tại sự kiện"),
    card(ICO.users,"red","Chờ xử lý",n(R,"registered"),"chưa xác nhận")
  ].join("");

function exportRegsExcel(){
  const ev = DATA.events_events[evDetail];
  const regs = regsOfEvent(ev.t);
  if(!regs.length){ alert("Chưa có người đăng ký để xuất excel."); return; }
  const esc = v => '"' + String(v ?? "").replace(/"/g,'""') + '"';
  const lines = [["STT","Họ tên","Email","Số điện thoại","Tổ chức","Trạng thái","Điểm danh"].map(esc).join(",")];
  regs.forEach((r,i)=>{ lines.push([i+1, r.name, r.email, r.phone, r.org, (STATUS[r.st]||{}).t || r.st, r.ci ? "Đã điểm danh" : "Chưa điểm danh"].map(esc).join(",")); });
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  const slug = ev.t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  a.href = URL.createObjectURL(blob);
  a.download = "danh-sach-dang-ky-" + (slug || "su-kien") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function pushNotif(icon, color, text, tab, sub){
  NOTIFS.unshift({icon, color, text, time:"Vừa xong", tab, sub, read:false});
  updateBell();
}
function updateBell(){
  const u = NOTIFS.filter(n=>!n.read).length;
  const b = document.getElementById("bellBadge");
  if(!b) return;
  b.style.display = u ? "flex" : "none";
  b.textContent = u;
}
function renderNotifs(){
  const list = document.getElementById("notifList");
  list.innerHTML = NOTIFS.length ? NOTIFS.map((n,i)=>
    `<div class="notif-item${n.read?"":" unread"}" onclick="notifGo(${i})">
      <span class="notif-ico" style="background:${ICO_BG[n.color]};color:${ICO_FG[n.color]}">${ICO[n.icon]||ICO.doc}</span>
      <div><div class="notif-text">${n.text}</div><div class="notif-time">${n.time}</div></div>
    </div>`).join("") : `<div class="notif-empty">Chưa có thông báo nào.</div>`;
  updateBell();
}
function toggleNotifs(e){
  if(e) e.stopPropagation();
  closeAvatarMenu();
  const p = document.getElementById("notifPanel");
  if(p.style.display==="block"){ p.style.display = "none"; }
  else { renderNotifs(); p.style.display = "block"; }
}
document.addEventListener("click", e=>{
  const p = document.getElementById("notifPanel");
  if(p && p.style.display==="block" && !e.target.closest("#notifPanel") && !e.target.closest("#btnBell")) p.style.display = "none";
  const m = document.getElementById("avatarMenu");
  if(m && m.style.display==="block" && !e.target.closest("#avatarMenu") && !e.target.closest("#btnAvatar")) m.style.display = "none";
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeAvatarMenu(); });
function notifReadAll(){ NOTIFS.forEach(n=>n.read=true); renderNotifs(); }
function notifGo(i){
  const n = NOTIFS[i]; if(!n) return;
  n.read = true;
  document.getElementById("notifPanel").style.display = "none";
  updateBell();
  gotoSection(n.tab, n.sub);
}

function gotoSection(tab, destSub){
  evDetail = null;
  cur = tab; sub = destSub || DEFAULT_SUB[tab] || null;
  document.querySelectorAll(".side-item").forEach(t=>t.classList.remove("active","group-on"));
  const target = document.querySelector(`.side-item[data-tab="${tab}"][data-sub="${sub}"]`) || document.querySelector(`.side-item[data-tab="${tab}"]`);
  if(target){ target.classList.add("active");
    const par = document.querySelector(`.side-parent[data-parent="${tab}"]`);
    if(par){ par.closest(".side-group").classList.add("open"); par.classList.add("group-on"); } }

function delItem(k, di){
  const r = DATA[k] && DATA[k][di]; if(!r) return;
  if(!confirm("Xóa mục này? (demo: xóa khỏi danh sách hiển thị, chưa có backend)")) return;
  const name = r.t || r.title || r.name || r.user || r.code || "mục đã chọn";
  const label = (TAB_META[k] && TAB_META[k].title) || "danh sách";
  DATA[k].splice(di,1);

function openRegForm(title){
  const ev = DATA.events_events[evDetail];

      const opts = DATA.events_events.map(e=>`<option${e.t===ev.t?" selected":""}>${e.t}</option>`).join("");

function fieldHTML(f){
  let label = f[0], type = f[1] || "text", note = "";
  const isEN = label.includes("(tiếng Anh)"); const opt = "";
  if(type.startsWith("check:")){ label = type.slice(6); type = "check"; }
  if(type.startsWith("thumb:")){ note = type.slice(6); type = "thumb"; }
  if(type.startsWith("select:")){ const o=type.slice(7).split("|").map(x=>`<option>${x}</option>`).join(""); return `<div class="field"><label>${label}</label><select>${o}</select></div>`; }
  if(type==="check") return `<div class="field"><label class="check"><input type="checkbox"> ${label}</label></div>`;
  if(type==="textarea") return `<div class="field"><label>${label}${opt}</label><textarea rows="4"></textarea></div>`;
  if(type==="date") return `<div class="field"><label>${label}</label><input type="date"></div>`;

    <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="rteCmd(this,'formatBlock','pre')" title="Khối code" style="font-size:12.5px">&lt;/&gt;</button>
    <span class="rte-sep"></span>
    <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="rteLink(this)" title="Chèn liên kết"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
    <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="rteImage(this)" title="Chèn ảnh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
    <button type="button" class="rte-btn" onmousedown="event.preventDefault()" onclick="rteCmd(this,'removeFormat')" title="Xóa định dạng">T<span style="font-size:9px;vertical-align:sub">x</span></button>
  </div>
  <div class="rte-body" contenteditable="true" data-ph="${label.includes('tiếng Anh') ? 'Nhập nội dung bằng tiếng Anh...' : 'Nhập nội dung tin tức...'}"></div></div></div>`;
  if(type==="text-req") return `<div class="field"><label>${label} <span class="req">*</span></label><input type="text" data-req="1" oninput="this.style.borderColor=''"></div>`;
  return `<div class="field"><label>${label}${opt}</label><input type="text"></div>`;
}

function rteCmd(el, cmd, val){
  const rte = el && el.closest ? el.closest(".rte") : null;
  const ed = rte ? rte.querySelector(".rte-body") : document.querySelector(".rte-body");
  if(ed) ed.focus();
  document.execCommand(cmd, false, val || null);
}
function rteLink(el){ const u = prompt("Nhập đường dẫn (URL):", "https://"); if(u) rteCmd(el, "createLink", u); }
function rteImage(el){ const u = prompt("Nhập URL ảnh:", "https://"); if(u) rteCmd(el, "insertImage", u); }
function previewThumb(input){
  if(!(input.files && input.files[0])) return;
  const rd = new FileReader();
  rd.onload = e => { document.getElementById("thumbPreview").innerHTML = `<img src="${e.target.result}" alt="Ảnh thumbnail">`; };
  rd.readAsDataURL(input.files[0]);
  document.getElementById("thumbName").textContent = "Đã chọn: " + input.files[0].name + " (demo: chỉ xem trước tại trình duyệt, chưa tải lên máy chủ).";
}
function tlRowHTML(time, text){
  return `<div class="tl-row"><input type="text" class="tl-time" placeholder="08:30" value="${time||""}"><input type="text" class="tl-text" placeholder="Nội dung hoạt động..." value="${text||""}"><button type="button" class="icon-btn danger" title="Xóa mốc này" onclick="delTimelineRow(this)">${ICO.trash}</button></div>`;
}
function addTimelineRow(){
  const c = document.getElementById("tlEditor"); if(!c) return;
  c.insertAdjacentHTML("beforeend", tlRowHTML("",""));
  const rows = c.querySelectorAll(".tl-text");
  if(rows.length) rows[rows.length-1].focus();
}
function delTimelineRow(btn){ const r = btn.closest(".tl-row"); if(r) r.remove(); }

function openModal(title, formKey){
  let fk = formKey || key();
  if(!FORMS[fk]) fk = "news_articles";
  document.getElementById("modalTitle").textContent = title;
  articleForm = fk==="news_articles" || fk==="events_event_news";
  if(articleForm){
    document.getElementById("modalTitle").textContent = title.includes("Sửa") ? "Chỉnh sửa bài viết" : "Tạo bài viết mới";
    document.getElementById("btnCancel").textContent = "Lưu bản nháp";
    document.getElementById("btnSave").textContent = "Xuất bản";
  }
  if(fk==="events_events"){
    document.getElementById("modalTitle").textContent = title.includes("Sửa") ? "Chỉnh sửa sự kiện" : "Thêm sự kiện mới";
  }
  document.getElementById("modalBody").innerHTML = FORMS[fk].map(fieldHTML).join("");
  document.querySelector("#modal .modal").classList.toggle("modal-wide", FORMS[fk].some(f=>f[1]==="editor"));
  document.getElementById("modal").classList.add("open");
}
function openModalFor(fk, title){ openModal(title, fk); }
function openEdit(){
  if(cur==="events" && sub==="events" && evDetail!==null){ openRegForm("Sửa người đăng ký (demo)"); return; }
  openModal("Sửa mục (demo)");
}
function previewNews(di, kk){
  const r = (DATA[kk||"news_articles"]||[])[di]; if(!r) return;
  const esc = s => String(s==null?"":s);
  let h = `<div class="pv-cat">${esc(r.c)}</div><h1 class="pv-title">${esc(r.t)}</h1>`;
  h += `<div class="pv-meta">Ngày đăng: ${esc(r.d)} &nbsp;·&nbsp; Nguồn: ${esc(r.s)}</div>`;
  if(r.img && NEWS_IMG[r.img]) h += `<img class="pv-img" src="${NEWS_IMG[r.img]}" alt="">`;
  if(r.lead) h += `<p class="pv-lead">${esc(r.lead)}</p>`;
  (r.copy || []).forEach(p => { h += `<p class="pv-p">${esc(p)}</p>`; });
  if(!r.lead) h += `<div class="pv-note">Bài này chưa có nội dung chi tiết thật (bài mẫu / bản nháp trong demo). Màn hình xem trước đang hiển thị khung trang bài viết như trên website; khi bài viết có nội dung hoàn chỉnh, phần xem trước sẽ hiển thị đầy đủ tiêu đề, ảnh và nội dung tại đây.</div>`;
  if(r.note) h += `<p class="pv-status">${esc(r.note)}</p>`;
  if(r.url) h += `<a class="pv-origin" href="${esc(r.url)}" target="_blank" rel="noopener">Đọc bài gốc ↗</a>`;
  document.getElementById("newsPreviewBody").innerHTML = h;
  document.getElementById("newsPreview").classList.add("open");
}
function closeNewsPreview(){ document.getElementById("newsPreview").classList.remove("open"); }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeNewsPreview(); });

function closeModal(){
  document.getElementById("modal").classList.remove("open");
  document.querySelector("#modal .modal").classList.remove("modal-wide");
  document.getElementById("btnCancel").textContent = "Hủy";
  articleForm = false;
  modalAction = null;
  const sv = document.getElementById("btnSave");
  sv.textContent = "Lưu"; sv.className = "btn btn-primary"; sv.style.display = "";
}

document.getElementById("btnAdd").onclick = ()=>{
  if(cur==="events" && sub==="events" && evDetail!==null){ exportRegsExcel(); return; }
  openModal("Thêm mới (demo)");
};
document.getElementById("btnClose").onclick = closeModal;
document.getElementById("btnCancel").onclick = ()=>{
  if(articleForm){
    articleForm = false;
    closeModal();
    pushNotif("pen", "gold", `Đã lưu bản nháp tại mục "${(TAB_META[key()]||{}).title||"bài viết"}" (demo)`, cur, sub);
    alert("Demo: đã lưu bản nháp vào bộ nhớ tạm (chưa có backend).");
    return;
  }
  closeModal();
};
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });
document.getElementById("btnSave").onclick = ()=>{
  const f = modalAction;
  const wasArticle = articleForm;
  if(!f){
    const req = document.querySelector("#modalBody [data-req]");
    if(req && !req.value.trim()){
      req.focus();
      req.style.borderColor = "#e5484d";
      alert("Vui lòng nhập Tiêu đề (tiếng Việt) — đây là trường bắt buộc. Các trường tiếng Anh không bắt buộc.");
      return;
    }
  }
  modalAction = null;
  closeModal();
  if(f){ f(); }
  else if(wasArticle){
    pushNotif("check", "green", `Đã xuất bản bài viết tại mục "${(TAB_META[key()]||{}).title||"bài viết"}" (demo)`, cur, sub);
    alert("Demo: bài viết đã được xuất bản (chưa có backend — chưa hiển thị thật trên website).");
  }
  else { pushNotif("pen", "blue", `Đã lưu thay đổi tại mục "${(TAB_META[key()]||{}).title||"nội dung"}" (demo)`, cur, sub); alert("Demo: đã lưu vào bộ nhớ tạm (chưa có backend)."); }
};
document.getElementById("btnFilter").onclick = ()=>{
  const p = document.getElementById("filterPanel");
  const open = p.classList.toggle("open");
  p.dataset.keep = open ? "1" : "";
};
["q","qTop"].forEach(id=>{
  document.getElementById(id).addEventListener("input", e=>{
    const other = id==="q" ? "qTop" : "q";
    const o = document.getElementById(other);
    if(o && o.value!==e.target.value) o.value = e.target.value;
    renderTable();
  });
});
document.getElementById("fStatus").addEventListener("change", renderTable);
document.getElementById("fCat").addEventListener("change", renderTable);
["fProv","fCap","fFrom","fTo"].forEach(id=>document.getElementById(id).addEventListener("change", renderTable));
document.getElementById("sideNav").addEventListener("click", e=>{
  const b = e.target.closest(".side-item"); if(!b) return;
  if(b.dataset.parent){
    if(window.innerWidth<=900){
      document.querySelectorAll(".side-item").forEach(t=>t.classList.remove("active","group-on"));
      const ch = document.querySelector(`.side-child[data-tab="${b.dataset.parent}"][data-sub="${b.dataset.first}"]`); if(ch) ch.classList.add("active");
      cur = b.dataset.parent; sub = b.dataset.first; evDetail = null; render(); return;
    }
    b.closest(".side-group").classList.toggle("open"); return;
  }
  document.querySelectorAll(".side-item").forEach(t=>t.classList.remove("active","group-on"));
  b.classList.add("active");
  const par = document.querySelector(`.side-parent[data-parent="${b.dataset.tab}"]`);
  if(par){ par.closest(".side-group").classList.add("open"); par.classList.add("group-on"); }
  cur = b.dataset.tab;
  sub = b.dataset.sub || DEFAULT_SUB[cur] || null;
  evDetail = null;
  render();
});
document.getElementById("subtabs").addEventListener("click", e=>{
  const b = e.target.closest(".subtab"); if(!b) return;
  sub = b.dataset.sub; render();
});
updateBell();
render();

</script>
</body>
</html>
